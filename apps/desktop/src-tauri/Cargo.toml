[package]
name = "app"
version = "0.1.0"
description = "Brief.ai desktop — local PDF and document tools"
authors = ["Brief.ai"]
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["process", "time", "io-util", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_System_Registry",
] }

# Windows MSVC linker hits LNK1318 "Unexpected PDB error" intermittently on
# this machine (real-time antivirus scanning is the usual cause — it locks
# the PDB file mid-write). Disabling debug info for build scripts and dev
# builds sidesteps the PDB write contention entirely rather than depending
# on an AV exclusion being configured correctly.
[profile.dev]
debug = false

[profile.dev.build-override]
debug = false
