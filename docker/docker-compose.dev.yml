services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: briefai
      MYSQL_USER: briefai
      MYSQL_PASSWORD: briefai_dev_password
      MYSQL_ROOT_PASSWORD: root_dev_password
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../apps/api
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://briefai:briefai_dev_password@mysql:3306/briefai
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
      SOFFICE_BIN: soffice
      QPDF_BIN: qpdf
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-v4-flash}
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set - generate one with 'openssl rand -hex 48'}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      STORAGE_DIR: /app/storage
      ADMIN_TOKEN: "${ADMIN_TOKEN:?ADMIN_TOKEN must be set - generate one with 'openssl rand -hex 32'}"
      BILLING_ENFORCED: ${BILLING_ENFORCED:-false}
      LEMON_SQUEEZY_API_KEY: ${LEMON_SQUEEZY_API_KEY:-}
      LEMON_SQUEEZY_STORE_ID: ${LEMON_SQUEEZY_STORE_ID:-}
      LEMON_SQUEEZY_WEBHOOK_SECRET: ${LEMON_SQUEEZY_WEBHOOK_SECRET:-}
      LEMON_SQUEEZY_VARIANT_LAWYER_WEEKLY: ${LEMON_SQUEEZY_VARIANT_LAWYER_WEEKLY:-}
      LEMON_SQUEEZY_VARIANT_LAWYER_MONTHLY: ${LEMON_SQUEEZY_VARIANT_LAWYER_MONTHLY:-}
      LEMON_SQUEEZY_VARIANT_LAWYER_QUARTERLY: ${LEMON_SQUEEZY_VARIANT_LAWYER_QUARTERLY:-}
      LEMON_SQUEEZY_VARIANT_LAWYER_YEARLY: ${LEMON_SQUEEZY_VARIANT_LAWYER_YEARLY:-}
      LEMON_SQUEEZY_VARIANT_ACCOUNTANT_WEEKLY: ${LEMON_SQUEEZY_VARIANT_ACCOUNTANT_WEEKLY:-}
      LEMON_SQUEEZY_VARIANT_ACCOUNTANT_MONTHLY: ${LEMON_SQUEEZY_VARIANT_ACCOUNTANT_MONTHLY:-}
      LEMON_SQUEEZY_VARIANT_ACCOUNTANT_QUARTERLY: ${LEMON_SQUEEZY_VARIANT_ACCOUNTANT_QUARTERLY:-}
      LEMON_SQUEEZY_VARIANT_ACCOUNTANT_YEARLY: ${LEMON_SQUEEZY_VARIANT_ACCOUNTANT_YEARLY:-}
      LEMON_SQUEEZY_VARIANT_RESEARCHER_WEEKLY: ${LEMON_SQUEEZY_VARIANT_RESEARCHER_WEEKLY:-}
      LEMON_SQUEEZY_VARIANT_RESEARCHER_MONTHLY: ${LEMON_SQUEEZY_VARIANT_RESEARCHER_MONTHLY:-}
      LEMON_SQUEEZY_VARIANT_RESEARCHER_QUARTERLY: ${LEMON_SQUEEZY_VARIANT_RESEARCHER_QUARTERLY:-}
      LEMON_SQUEEZY_VARIANT_RESEARCHER_YEARLY: ${LEMON_SQUEEZY_VARIANT_RESEARCHER_YEARLY:-}
      LITELLM_PROXY_URL: http://litellm:4000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      # Mirrored from the litellm service purely so the admin panel's AI
      # providers page can show a masked "configured" status per provider —
      # the api container never calls these directly, LiteLLM does.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-Brief.ai <noreply@brief.ai>}
      APP_URL: ${APP_URL:-http://localhost:3000}
    ports:
      - '3001:3001'
    depends_on:
      mysql:
        condition: service_healthy
      litellm:
        condition: service_started
    volumes:
      - library_storage:/app/storage
      - embedding_model_cache:/app/.cache
    command: sh -c "npx prisma migrate deploy && node dist/main.js"

  litellm-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: litellm_dev_password
    volumes:
      - litellm_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U litellm']
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted AI routing layer — see docker/litellm-config.yaml for the
  # task-simple/task-complex model aliases. Its own Postgres store (above)
  # persists per-customer virtual keys and budgets across restarts.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    environment:
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY must be set - generate one with 'openssl rand -hex 32'}"
      DATABASE_URL: postgresql://litellm:litellm_dev_password@litellm-db:5432/litellm
      # Enables the /model/new, /model/update, /model/delete management API —
      # required for the admin panel's AI providers / routing-rules section
      # to edit task-simple/task-complex live, without restarting the proxy.
      STORE_MODEL_IN_DB: 'True'
    command: ['--config', '/app/config.yaml', '--port', '4000']
    ports:
      - '4000:4000'
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    depends_on:
      litellm-db:
        condition: service_healthy

volumes:
  mysql_data:
  library_storage:
  embedding_model_cache:
  litellm_db_data:
